<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velichka Atanasova Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040514"/>
      <stop offset="55%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#0E1326"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5BD1FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B5CFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cometTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8ECFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#5BD1FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      .title {
        font-family: "Manrope", "Segoe UI", Arial, sans-serif;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.6px;
        fill: #FFFFFF;
      }
      .subtitle {
        font-family: "Manrope", "Segoe UI", Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.35px;
        fill: #E8ECFF;
      }
      .tagline {
        font-family: "Manrope", "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.35px;
        fill: #A3A5C4;
      }

      .lineDot { animation: lineDot 9s linear infinite; }
      .linePulse { animation: linePulse 6s ease-in-out infinite; }

      .star { animation: twinkle 8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .comet { animation: comet 18s linear infinite; transform-origin: center; transform-box: fill-box; }
      .cometSlow { animation-duration: 24s; }
      .cometFast { animation-duration: 14s; }

      @keyframes lineDot {
        0% { transform: translateX(0); opacity: 0.6; }
        50% { opacity: 1; }
        100% { transform: translateX(520px); opacity: 0.6; }
      }
      @keyframes linePulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
      @keyframes twinkle {
        0% { opacity: 0; }
        25% { opacity: 0.75; }
        55% { opacity: 0.45; }
        80% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes comet {
        0% { opacity: 0; transform: translate(0, 0); }
        6% { opacity: 0.9; }
        18% { opacity: 0; transform: translate(260px, 190px); }
        100% { opacity: 0; transform: translate(260px, 190px); }
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g>
    <circle class="star" cx="90" cy="70" r="1.6" fill="#5BD1FF" style="animation-delay:-1s"/>
    <circle class="star" cx="180" cy="120" r="1.2" fill="#7B5CFF" style="animation-delay:-4s"/>
    <circle class="star" cx="260" cy="60" r="1.4" fill="#5BD1FF" style="animation-delay:-2s"/>
    <circle class="star" cx="350" cy="90" r="1.1" fill="#7B5CFF" style="animation-delay:-6s"/>
    <circle class="star" cx="420" cy="160" r="1.5" fill="#5BD1FF" style="animation-delay:-3s"/>
    <circle class="star" cx="520" cy="110" r="1.2" fill="#7B5CFF" style="animation-delay:-7s"/>
    <circle class="star" cx="610" cy="70" r="1.6" fill="#5BD1FF" style="animation-delay:-5s"/>
    <circle class="star" cx="700" cy="140" r="1.3" fill="#7B5CFF" style="animation-delay:-8s"/>
    <circle class="star" cx="810" cy="80" r="1.5" fill="#5BD1FF" style="animation-delay:-9s"/>
    <circle class="star" cx="900" cy="130" r="1.2" fill="#7B5CFF" style="animation-delay:-10s"/>
    <circle class="star" cx="1020" cy="70" r="1.4" fill="#5BD1FF" style="animation-delay:-12s"/>
    <circle class="star" cx="1120" cy="150" r="1.2" fill="#7B5CFF" style="animation-delay:-11s"/>
    <circle class="star" cx="1180" cy="90" r="1.4" fill="#5BD1FF" style="animation-delay:-13s"/>
    <circle class="star" cx="60" cy="120" r="1.2" fill="#7B5CFF" style="animation-delay:-15s"/>
    <circle class="star" cx="240" cy="150" r="1.3" fill="#5BD1FF" style="animation-delay:-16s"/>
    <circle class="star" cx="460" cy="70" r="1.1" fill="#7B5CFF" style="animation-delay:-17s"/>
    <circle class="star" cx="640" cy="110" r="1.2" fill="#5BD1FF" style="animation-delay:-19s"/>
    <circle class="star" cx="760" cy="60" r="1.1" fill="#7B5CFF" style="animation-delay:-20s"/>
    <circle class="star" cx="980" cy="110" r="1.2" fill="#5BD1FF" style="animation-delay:-21s"/>
    <circle class="star" cx="1240" cy="140" r="1.1" fill="#7B5CFF" style="animation-delay:-22s"/>

    <circle class="star" cx="140" cy="230" r="1.3" fill="#5BD1FF" style="animation-delay:-6s"/>
    <circle class="star" cx="260" cy="210" r="1.1" fill="#7B5CFF" style="animation-delay:-9s"/>
    <circle class="star" cx="380" cy="260" r="1.4" fill="#5BD1FF" style="animation-delay:-4s"/>
    <circle class="star" cx="520" cy="230" r="1.2" fill="#7B5CFF" style="animation-delay:-2s"/>
    <circle class="star" cx="680" cy="250" r="1.5" fill="#5BD1FF" style="animation-delay:-7s"/>
    <circle class="star" cx="820" cy="220" r="1.2" fill="#7B5CFF" style="animation-delay:-5s"/>
    <circle class="star" cx="960" cy="250" r="1.4" fill="#5BD1FF" style="animation-delay:-8s"/>
    <circle class="star" cx="1100" cy="230" r="1.2" fill="#7B5CFF" style="animation-delay:-10s"/>
    <circle class="star" cx="80" cy="260" r="1.1" fill="#7B5CFF" style="animation-delay:-12s"/>
    <circle class="star" cx="300" cy="280" r="1.2" fill="#5BD1FF" style="animation-delay:-13s"/>
    <circle class="star" cx="460" cy="230" r="1.1" fill="#7B5CFF" style="animation-delay:-14s"/>
    <circle class="star" cx="600" cy="270" r="1.2" fill="#5BD1FF" style="animation-delay:-15s"/>
    <circle class="star" cx="760" cy="230" r="1.1" fill="#7B5CFF" style="animation-delay:-16s"/>
    <circle class="star" cx="920" cy="280" r="1.2" fill="#5BD1FF" style="animation-delay:-17s"/>
    <circle class="star" cx="1180" cy="250" r="1.1" fill="#7B5CFF" style="animation-delay:-18s"/>
  </g>

  <g class="comet cometSlow" style="animation-delay:-3s;">
    <g transform="rotate(25 180 40)">
      <rect x="180" y="40" width="140" height="2" rx="1" fill="url(#cometTail)"/>
      <circle cx="320" cy="41" r="2.4" fill="#FFFFFF"/>
    </g>
  </g>
  <g class="comet" style="animation-delay:-9s;">
    <g transform="rotate(25 520 30)">
      <rect x="520" y="30" width="160" height="2" rx="1" fill="url(#cometTail)"/>
      <circle cx="680" cy="31" r="2.2" fill="#E8ECFF"/>
    </g>
  </g>
  <g class="comet cometFast" style="animation-delay:-15s;">
    <g transform="rotate(25 860 50)">
      <rect x="860" y="50" width="120" height="2" rx="1" fill="url(#cometTail)"/>
      <circle cx="980" cy="51" r="2" fill="#FFFFFF"/>
    </g>
  </g>

  <g>
    <text x="640" y="150" text-anchor="middle" class="title">Velichka Atanasova</text>
    <text x="640" y="188" text-anchor="middle" class="subtitle">AI-FIRST Development • Webentwicklung • SaaS-Projekte • Apps</text>
    <text x="640" y="214" text-anchor="middle" class="tagline">Fachinformatikerin für Anwendungsentwicklung</text>
  </g>

  <rect class="linePulse" x="360" y="224" width="560" height="2" fill="url(#accent)"/>
  <circle class="lineDot" cx="360" cy="225" r="3" fill="#5BD1FF"/>
</svg>